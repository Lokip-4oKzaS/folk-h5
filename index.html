<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北方民俗文化问答</title>
<style>
:root{
  --paper:#f7f1e3;--ink:#3a2e24;
  --cinnabar:#a53b2e;--cinnabar-deep:#7e2c22;
  --gold:#c9a227;--gold-light:#e8d49a;--jade:#3d6b5a;
  --line:rgba(58,46,36,.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:"Noto Serif SC","Songti SC","SimSun",serif;color:var(--ink);
  background:radial-gradient(1200px 800px at 85% -5%,rgba(201,162,39,.10),transparent 60%),
    radial-gradient(900px 700px at -10% 30%,rgba(61,107,90,.08),transparent 60%),
    radial-gradient(1000px 900px at 50% 110%,rgba(165,59,46,.07),transparent 55%),var(--paper);
  overflow-x:hidden;position:relative;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:repeating-linear-gradient(0deg,rgba(58,46,36,.016) 0 1px,transparent 1px 3px);}
#snow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:50;}

.poster{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;gap:22px;padding:40px 20px;}
.poster .seal{width:112px;height:112px;border-radius:14px;background:var(--cinnabar);
  display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--paper);
  font-weight:700;font-size:13px;letter-spacing:.4em;text-indent:.4em;
  box-shadow:0 10px 26px rgba(126,44,34,.38),inset 0 0 0 3px rgba(247,241,227,.55);
  transform:rotate(-3deg);animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both;}
.poster .seal b{font-size:34px;letter-spacing:.1em;text-indent:.1em;line-height:1.05;}
.poster h1{font-size:clamp(38px,8vw,74px);font-weight:900;letter-spacing:.12em;line-height:1.1;
  background:linear-gradient(180deg,#8a2f24,#5c1f18);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 0 rgba(247,241,227,.8);animation:rise .9s .1s both;}
.poster .sub{font-size:clamp(15px,2.4vw,19px);letter-spacing:.5em;text-indent:.5em;color:var(--jade);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 26px;margin-top:6px;animation:rise .9s .22s both;}
.poster .deco-line{display:flex;align-items:center;gap:14px;color:var(--gold);animation:rise .9s .34s both;}
.poster .deco-line::before,.poster .deco-line::after{content:"";width:70px;height:1px;}
.poster .deco-line::before{background:linear-gradient(90deg,transparent,var(--gold));}
.poster .deco-line::after{background:linear-gradient(270deg,transparent,var(--gold));}
.poster .meta{font-size:13px;letter-spacing:.35em;color:rgba(58,46,36,.55);margin-top:8px;animation:rise .9s .4s both;}
.btn{margin-top:26px;padding:17px 58px;border:none;cursor:pointer;font-family:inherit;font-size:18px;
  letter-spacing:.4em;text-indent:.4em;color:var(--paper);
  background:linear-gradient(135deg,var(--cinnabar),var(--cinnabar-deep));border-radius:4px;
  box-shadow:0 10px 26px rgba(126,44,34,.40),inset 0 1px 0 rgba(247,241,227,.35);
  position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;animation:rise .9s .5s both;}
.btn::after{content:"";position:absolute;top:0;left:-130%;width:80%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(247,241,227,.5),transparent);
  transition:left .6s;transform:skewX(-20deg);}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(126,44,34,.45);}
.btn:hover::after{left:140%;}
@keyframes pop{from{transform:rotate(-8deg) scale(.4);opacity:0;}to{transform:rotate(-3deg) scale(1);opacity:1;}}
@keyframes rise{from{transform:translateY(26px);opacity:0;}to{transform:none;opacity:1;}}
@keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

.panel{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:40px 18px 80px;}
.quiz{background:rgba(247,241,227,.88);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 22px 60px rgba(58,46,36,.14);backdrop-filter:blur(4px);
  padding:34px 30px 30px;animation:fadein .6s both;}
@keyframes fadein{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.badge{font-size:13px;letter-spacing:.2em;color:var(--jade);border:1px solid rgba(61,107,90,.35);padding:6px 14px;border-radius:30px;}
.progress-ring{width:58px;height:58px;}.progress-ring .bg{stroke:rgba(58,46,36,.1);}
.progress-ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .5s;}
.progress-txt{fill:var(--cinnabar-deep);font:700 17px serif;}
.q-num{font-size:13px;letter-spacing:.3em;color:rgba(58,46,36,.5);margin-bottom:12px;}
.q-text{font-size:clamp(21px,3.6vw,27px);font-weight:800;line-height:1.6;margin-bottom:26px;color:var(--ink);}
.options{display:flex;flex-direction:column;gap:13px;}
.opt{position:relative;text-align:left;padding:16px 18px 16px 54px;border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:17px;letter-spacing:.04em;color:var(--ink);background:#fffdf6;border:1px solid var(--line);
  transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;overflow:hidden;}
.opt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background .2s;}
.opt .mark{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:1px solid var(--line);
  border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:13px;color:var(--paper);transition:.2s;}
.opt:hover{transform:translateX(5px);border-color:var(--gold);box-shadow:0 6px 18px rgba(201,162,39,.16);}
.opt:hover .mark{border-color:var(--gold);}
.opt.selected{border-color:var(--cinnabar);background:#fbf0ec;}
.opt.selected .mark{background:var(--cinnabar);border-color:var(--cinnabar);}
.opt.selected::before{background:var(--cinnabar);}
.opt.correct{border-color:var(--jade);background:#eef4ef;animation:shake-ok .4s;}
.opt.correct .mark{background:var(--jade);border-color:var(--jade);}
.opt.wrong{border-color:var(--cinnabar);background:#fbe9e5;animation:shake .45s;}
.opt.wrong .mark{background:var(--cinnabar);border-color:var(--cinnabar);}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-4px);}}
@keyframes shake-ok{0%{transform:scale(1);}50%{transform:scale(1.015);}100%{transform:scale(1);}}
.foot{margin-top:26px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.bookmark{padding:11px 18px;border:1px solid var(--line);background:#fffdf6;color:var(--jade);border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:14px;letter-spacing:.1em;transition:.2s;}
.bookmark.on{border-color:var(--gold);color:var(--gold);background:#fbf4df;}
.btn-next{margin:0;font-size:16px;padding:14px 44px;}
.btn-next:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}

.result{background:rgba(247,241,227,.92);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 22px 60px rgba(58,46,36,.14);padding:46px 30px;text-align:center;animation:fadein .6s both;}
.medal{width:130px;height:130px;margin:0 auto 20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold) 55%,#927314);
  display:flex;justify-content:center;align-items:center;color:var(--paper);font-size:52px;
  box-shadow:0 14px 34px rgba(201,162,39,.5),inset 0 0 0 5px rgba(247,241,227,.7);animation:floaty 3s ease-in-out infinite;}
.result h2{font-size:30px;letter-spacing:.2em;color:var(--cinnabar-deep);margin-bottom:14px;}
.result .score{font-size:52px;font-weight:900;color:var(--gold);letter-spacing:.05em;line-height:1;}
.result .score small{font-size:22px;color:rgba(58,46,36,.5);}
.result .grade{font-size:17px;color:var(--jade);margin:16px 0 6px;letter-spacing:.3em;}
.result .comment{font-size:14px;color:rgba(58,46,36,.6);margin-bottom:24px;line-height:1.7;}
.result .bar{height:14px;background:rgba(58,46,36,.1);border-radius:30px;overflow:hidden;margin:0 auto 26px;max-width:420px;}
.result .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cinnabar));border-radius:30px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.3,1);}
.review{margin-top:26px;text-align:left;}
.review h3{font-size:19px;letter-spacing:.25em;color:var(--jade);border-bottom:2px solid var(--gold-light);padding-bottom:10px;margin-bottom:18px;}
.card{background:#fffdf6;border-left:4px solid var(--gold);border-radius:10px;padding:16px 18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(58,46,36,.06);}
.card .q{font-weight:700;margin-bottom:8px;}
.card .you{font-size:14px;color:var(--cinnabar);margin-bottom:4px;}
.card .right{font-size:14px;color:var(--jade);}
.card .tip{font-size:13px;color:rgba(58,46,36,.6);margin-top:8px;line-height:1.7;border-top:1px dashed var(--line);padding-top:8px;}
.badge-row{font-size:13px;color:var(--gold);letter-spacing:.4em;margin-top:26px;text-align:center;}
.hidden{display:none;}
</style>
</head>
<body>
<div id="snow"></div>
<div class="poster" id="poster">
  <div class="seal"><b>冬</b><span>季</span></div>
  <div class="deco-line"><span>❖</span></div>
  <h1>北方民俗文化问答</h1>
  <div class="sub">北 国 风 情 · 时 令 雅 俗</div>
  <div class="meta">共廿题 · 每题五分 · 及第六十分</div>
  <div style="margin-top:26px;">
    <button class="btn" style="margin:0 0 16px 0;" id="startBtn">先 读 知 识 · 再 开 卷</button><br>
    <button class="btn" style="margin:0;background:linear-gradient(135deg,var(--jade),#2c5144);" id="startDirectBtn">直 接 开 卷</button>
  </div>
</div>
<div class="panel hidden" id="quizPanel">
  <div class="quiz">
    <div class="topbar">
      <span class="badge" id="badge">第一题</span>
      <svg class="progress-ring" viewBox="0 0 60 60">
        <circle class="bg" cx="30" cy="30" r="25" fill="none" stroke-width="5"/>
        <circle class="fg" id="ringFg" cx="30" cy="30" r="25" fill="none" stroke-width="5" stroke-dasharray="157" stroke-dashoffset="157"/>
        <text class="progress-txt" x="30" y="36" text-anchor="middle" id="ringTxt">0</text>
      </svg>
    </div>
    <div class="q-num" id="qNum">第 1 / 20 题</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="options"></div>
    <div class="foot">
      <button class="bookmark" id="bookmark">♡ 收藏此题</button>
      <button class="btn btn-next" id="nextBtn" disabled>下一题</button>
    </div>
  </div>
</div>
<div class="panel hidden" id="resultPanel">
  <div class="result">
    <div class="medal" id="medal">🏮</div>
    <h2 id="gradeTitle">放 榜</h2>
    <div class="score" id="score">0<small> / 100</small></div>
    <div class="grade" id="grade"></div>
    <div class="comment" id="comment"></div>
    <div class="bar"><span id="barFill"></span></div>
    <div class="badge-row">❖ 寒 来 暑 往 · 秋 收 冬 藏 ❖</div>
    <div class="review" id="reviewBox"></div>
    <button class="btn" id="restartBtn" style="margin:8px auto 10px;display:block;">再 试 一 回</button>
  </div>
</div>
<script>
var QUESTIONS=[
{q:"北方冬季最具代表性的民俗食品是哪一项？",options:["饺子","凉粉","糍粑","汤圆"],ans:0,tip:"北方素有\u201c冬至不端饺子碗，冻掉耳朵没人管\u201d之说，饺子是北方冬日与节庆的重要民俗食品。"},
{q:"\u201c东北三大怪\u201d中不包括以下哪一项？",options:["窗户纸糊在外","大姑娘叼烟袋","养个孩子吊起来","火盆沿上烙干粮"],ans:3,tip:"通常说法为\u201c窗户纸糊在外、大姑娘叼烟袋、养个孩子吊起来\u201d三种怪象。"},
{q:"北方民间称腊月二十三为？",options:["小年","元宵","破五","龙抬头"],ans:0,tip:"腊月二十三日为祭灶日，俗称小年，北方多在此时扫尘、送灶王爷上天。"},
{q:"除夕守岁时，北方许多家庭会一起做哪件事？",options:["包饺子","赏花灯","赛龙舟","登高插茱萸"],ans:0,tip:"北方除夕之夜的\u201c更岁交子\u201d，多以全家一起包饺子、吃饺子来辞旧迎新。"},
{q:"\u201c二月二，龙抬头\u201d时北方常有什么习俗？",options:["剃头（理发）","吃粽子","插艾草","喝雄黄酒"],ans:0,tip:"民间认为二月二理发可讨\u201c龙抬头\u201d的好彩头，故称剃龙头。"},
{q:"下列哪项是北方过大年时常见的装饰？",options:["贴窗花与春联","挂菖蒲艾叶","点孔明灯","摆南瓜灯"],ans:0,tip:"北方年俗重门面装饰，新春贴春联、剪窗花、倒贴福字极为普遍。"},
{q:"北方庙会中常出现的传统表演是？",options:["高跷与秧歌","孔雀舞","芦笙舞","锅庄舞"],ans:0,tip:"踩高跷、扭秧歌是北方庙会与社火中富有代表性的民间表演。"},
{q:"\u201c九九消寒图\u201d在北方寒冬主要用来？",options:["计算冬尽春来的日子","占卜天气播报","记录每日饮食","练习书法入门"],ans:0,tip:"从冬至起以消寒图每日涂一笔，共九九八十一天，用以期盼寒冬结束。"},
{q:"北方冬季\u201c冻梨\u201d的正确吃法是？",options:["先将梨冻硬再吃","趁热蘸糖吃","煮熟后放凉吃","油炸之后吃"],ans:0,tip:"冻梨须先冻透，食用前置于凉水中\u201c缓\u201d出冰壳后变软即可食用，是东北冬日特色。"},
{q:"北方正月十五元宵节最具代表性的食物是？",options:["元宵","青团","月饼","粽子"],ans:0,tip:"北方多称\u201c元宵\u201d，将馅料滚成球状；南方多称\u201c汤圆\u201d，为包制。"},
{q:"\u201c贴倒福\u201d在北方民俗中的寓意是？",options:["福到了","防寒保暖","招财进宝","团圆美满"],ans:0,tip:"以\u201c倒\u201d谐音\u201c到\u201d，北方贴倒福取\u201c福到了\u201d的吉利口彩。"},
{q:"北方\u201c豆包\u201d\u201c粘豆包\u201d\u201c萨其马\u201d等甜食，多与哪个季节相关？",options:["冬季年节","盛夏消暑","仲春踏青","金秋赏月"],ans:0,tip:"粘豆包、萨其马等常为北方农家冬季备置、过年食用的传统食品。"},
{q:"北方民谚\u201c三九四九，棒打不走\u201d指的是？",options:["天气极冷，人冻得不愿外出","农人耕作不休","燕子南飞","冰雪消融"],ans:0,tip:"三九四九为一年中最冷时段，民谚形容天寒地冻、少人出门。"},
{q:"北方\u201c杀年猪\u201d习俗多发生在什么时间？",options:["腊月前后","清明前后","仲秋","入伏"],ans:0,tip:"旧时北方农家多在腊月宰杀筹备年猪，为过年备下肉菜并请乡邻吃\u201c杀猪菜\u201d。"},
{q:"\u201c腊七腊八，冻掉下巴\u201d中北方腊八的食俗是？",options:["喝腊八粥","吃月饼","饮屠苏酒","食青团"],ans:0,tip:"腊八节北方多熬腊八粥以御寒，也供佛、祭祀并分赠邻里。"},
{q:"北方冬季取暖的旧时民俗器具是？",options:["火炕与火盆","竹凉席","吊脚楼火塘","吊扇"],ans:0,tip:"火炕、火盆是北方传统的御寒取暖民俗器具。"},
{q:"\u201c过了腊八就是年\u201d说明进入腊八后北方百姓？",options:["开始张罗过年准备","停止劳作冬眠","陆续返乡扫墓","开始春耕"],ans:0,tip:"腊八后年味渐浓，民间开始置办年货、扫尘备年。"},
{q:"北方正月里\u201c秧歌\u201d\u201c二人转\u201d等多为哪种场合表演？",options:["社火、庙会与正月酬神游乐","祭祖扫墓","婚嫁仪仗","丧葬祭祀"],ans:0,tip:"秧歌、二人转等常活跃于正月社火、庙会等节庆游乐场合。"},
{q:"北方\u201c春饼\u201d在立春时节吃，其寓意是？",options:["迎春尝新","纪念秋收","祭拜灶神","祈求多子"],ans:0,tip:"立春吃春饼、咬春，寓意迎接新春、尝得时鲜。"},
{q:"北方民俗整体上最重视下列哪一方面？",options:["时令节序与传统节庆","只看西方节庆","不重节气只重月圆","与天时无关"],ans:0,tip:"北方民俗整体重时令节序，与二十四节气、传统节庆紧密相连。"}
];
var idx=0,score=0,shown=false,bmarks=new Set(),review=[],answered=false;
var snow=document.getElementById('snow');
(function(){var n=70;for(var i=0;i<n;i++){var s=document.createElement('span');
s.style.cssText="position:absolute;top:-20px;left:"+(Math.random()*100)+"%;width:"+(3+Math.random()*5)+"px;height:"+(3+Math.random()*5)+"px;background:rgba(255,255,255,.8);border-radius:50%;opacity:"+(.3+Math.random()*.6)+";animation:fall "+(8+Math.random()*10)+"s linear "+(Math.random()*10)+"s infinite;";
snow.appendChild(s);}var st=document.createElement('style');st.textContent="@keyframes fall{to{transform:translateY(110vh) translateX(20px);}}";document.head.appendChild(st);})();
function beep(freq,dur,delay,type){var c=new (window.AudioContext||window.webkitAudioContext)();var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=freq;o.connect(g);g.connect(c.destination);var t=c.currentTime+(delay||0);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur);setTimeout(function(){c.close();},dur*1000+300);}
function ok(){beep(523.25,.14,0);beep(659.25,.14,.1);beep(783.99,.22,.2);}
function no(){beep(220,.22,0,"sawtooth");beep(174,.28,.14,"sawtooth");}
var ringFg=document.getElementById('ringFg'),ringTxt=document.getElementById('ringTxt');
function updateRing(){var p=idx*100/20;var off=157-(157*p/100);ringFg.style.strokeDashoffset=off;ringTxt.textContent=idx;}
function render(){var qu=QUESTIONS[idx];answered=false;
document.getElementById('badge').textContent='第 '+(idx+1)+' 题';
document.getElementById('qNum').textContent='第 '+(idx+1)+' / 20 题';
document.getElementById('qText').textContent=qu.q;
var box=document.getElementById('options');box.innerHTML='';var marks=['一','二','三','四'];
qu.options.forEach(function(op,o){var d=document.createElement('div');d.className='opt';
d.innerHTML='<span class="mark">'+marks[o]+'</span>'+op;
d.onclick=function(){if(answered)return;answered=true;shown=false;
var correct=(o===qu.ans);
if(correct){score++;ok();d.classList.add('correct');}
else{no();d.classList.add('wrong');d.innerHTML='<span class="mark">✕</span>'+op;box.children[qu.ans].classList.add('correct');review.push({q:qu.q,you:op,right:qu.options[qu.ans],tip:qu.tip});}
document.getElementById('nextBtn').disabled=false;};
box.appendChild(d);});
document.getElementById('nextBtn').disabled=true;
document.getElementById('bookmark').classList.toggle('on',bmarks.has(idx));
document.getElementById('bookmark').textContent=bmarks.has(idx)?'★ 已收藏':'♡ 收藏此题';
updateRing();}
function startQuiz(){document.getElementById('poster').classList.add('hidden');document.getElementById('quizPanel').classList.remove('hidden');render();}
document.getElementById('startBtn').onclick=function(){startQuiz();};
document.getElementById('startDirectBtn').onclick=function(){startQuiz();};
document.getElementById('bookmark').onclick=function(){if(bmarks.has(idx))bmarks.delete(idx);else bmarks.add(idx);document.getElementById('bookmark').classList.toggle('on');document.getElementById('bookmark').textContent=bmarks.has(idx)?'★ 已收藏':'♡ 收藏此题';};
document.getElementById('nextBtn').onclick=function(){idx++;answered=false;if(idx>=20){showResult();}else{render();}};
function showResult(){document.getElementById('quizPanel').classList.add('hidden');document.getElementById('resultPanel').classList.remove('hidden');
var s=score*5;var medal=document.getElementById('medal');medal.textContent=s>=85?'🏆':s>=60?'🏮':s>=40?'🕯️':'❄️';
document.getElementById('score').innerHTML=s+'<small> / 100</small>';
var grade,comment;
if(s>=85){grade='甲 上 · 民俗通';comment='渥闻博识，深谙北地岁时风物，堪称民俗行家！';}
else if(s>=60){grade='甲 等 · 及第';comment='对北方民俗了然于心，已具大家气象，再接再厉。';}
else if(s>=40){grade='乙 等 · 可观';comment='尚有几处疏漏，多加留心节令习俗，必有所成。';}
else{grade='丙 等 · 勤学';comment='初涉其中不以为拙，勤加温习，来日可期。';}
document.getElementById('grade').textContent=grade;document.getElementById('comment').textContent=comment;
document.getElementById('gradeTitle').textContent=review.length?'放 榜 · 卷后温故':'放 榜';
setTimeout(function(){document.getElementById('barFill').style.width=(s)+'%';},100);
var rb=document.getElementById('reviewBox');
if(review.length){rb.innerHTML='<h3>错 题 温 故</h3>'+review.map(function(r){return '<div class="card"><div class="q">'+r.q+'</div><div class="you">君答：'+r.you+'</div><div class="right">正解：'+r.right+'</div><div class="tip">'+r.tip+'</div></div>';}).join('');}else{rb.innerHTML='';}}
document.getElementById('restartBtn').onclick=function(){idx=0;score=0;review=[];bmarks=new Set();document.getElementById('resultPanel').classList.add('hidden');document.getElementById('poster').classList.remove('hidden');};
</script>
</body>
</html>
